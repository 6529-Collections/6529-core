# Signs 6529 Desktop's macOS and Windows release files with 6529's signing
# identities: the Developer ID certificate and Apple notarization of
# build-mac.yml, and the Azure Key Vault certificate of sign-windows.yml. It is
# sign-validator.yml's pattern for 6529 Desktop (the Tauri app, built in its
# own repository); only the signing happens here, because those identities
# live only in this repository's secrets. The owner approved this workflow on
# 2026-11-14.
#
# Started by hand only (workflow_dispatch):
#   version         6529 Desktop's version, for example 0.1.0 (names the results)
#   bundle_url      an HTTPS link (a pre-signed URL) to a zip of the unsigned
#                   files. The link is masked in the logs.
#   bundle_sha256   the zip's SHA-256, checked before anything else
#   recipient_cert  a PEM X.509 certificate with an RSA key. The signed files
#                   are encrypted to it, because this repository is public, and
#                   so are its logs and run artifacts
#   notarize        false to codesign without notarizing (default true)
#   kind            app (default) or installer.
#   platforms       all (default) or windows: windows skips the macOS job of a
#                   kind app run (Windows-only test builds; a release signs both)
#
# kind app: what goes inside the installers. The zip holds
#   build-info.json     the build's facts (the desktop repository's
#                       packaging/signing/build_info.py). Its "windows.files"
#                       lists every Windows program file of the bundle as
#                       {path, sha256, size, role}; role "sign" is signed here,
#                       role "vendor" (only node/node.exe, the official Node.js
#                       build) must already carry the OpenJS Foundation's valid
#                       signature and is left as it is. "macos.dmg" names the
#                       disk image as {name, sha256, size}.
#   windows/<path>      each file build-info.json lists (the app's .exe, 6529
#                       Core's c6529.exe and client-signer.exe, node/node.exe,
#                       the web server's native addon and its DLLs, and
#                       nsis/uninstall.exe, see below). A
#                       program file in windows/ that build-info.json does not
#                       list is refused, so nothing is left unsigned unseen
#   macos/<name>.dmg    the unsigned disk image Tauri made, holding one .app
#   Windows: each "sign" file is signed. The NSIS installer is then built
#   around them in the desktop repository, and signed with kind installer.
#   nsis/uninstall.exe, when listed, is the uninstaller makensis built for
#   that installer (NSIS's stub is 32-bit: the one x86 program taken, under
#   exactly this name). The desktop repository builds the installer again,
#   checks makensis made the same uninstaller byte for byte, and stores the
#   signed copy in its place (!uninstfinalize). NSIS and the installer script
#   never run here: this workflow only signs files.
#   macOS: every Mach-O file in the .app is signed inside-out (libraries,
#   then programs, then the app), each with the hardened runtime, a secure
#   timestamp and its own entitlements from .github/desktop-signing/:
#     Contents/Resources/node/bin/node      node.entitlements.plist (JIT)
#     Contents/Resources/engine/c6529       c6529.entitlements.plist (none)
#     Contents/Resources/engine/client-signer  c6529.entitlements.plist (none)
#     the app (Contents/MacOS/<executable>) app.entitlements.plist (none)
#     libraries (.dylib, node addons)       no entitlements
#   Any other program in the app is refused. The app is notarized and
#   stapled, the disk image is made again around it, codesigned, notarized
#   and stapled.
# kind installer (Windows only): the zip holds
#   windows/<name>-setup.exe  one or more NSIS installers built around files
#                       a kind app run signed
#   build-info.json     optional: "windows.files" as above, with the signed
#                       files' SHA-256. When present, each "sign" and
#                       "vendor" file must be inside each installer, byte for
#                       byte (checked with 7-Zip). nsis/uninstall.exe is the
#                       exception: makensis stores it in a form 7-Zip does not
#                       extract, so its place in the installer is checked in
#                       the desktop repository after a test install
#
# Results, kept 14 days as this run's artifacts:
#   desktop-<version>-macos-signed     a .tar of the signed files, encrypted
#                                      to recipient_cert (.tar.p7m)
#   desktop-<version>-windows-signed   the same for Windows
#   desktop-<version>-SHA256SUMS       the SHA-256 of every signed file
# To decrypt:
#   openssl smime -decrypt -binary -inform DER -in <file>.tar.p7m -inkey <key> -out <file>.tar
#
# It publishes nothing: no release, no tag, no upload, no update feed and no
# notifications. Secrets reach only the steps that use them and are never
# printed. The files it signs are never run here: a compromised build must
# not run where the signing secrets are.
#
# Trust: whoever starts it chooses what 6529's identities sign. That takes
# write access to this repository, which already reaches these secrets
# through the other workflows. bundle_sha256 protects the transfer, not the
# provenance: the operator builds the bundle from a tagged commit of the
# desktop repository (packaging/release-signed.sh there) and checks the
# signed files after this run.

name: Sign desktop

run-name: Sign desktop ${{ inputs.version }} (${{ inputs.kind || 'app' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "6529 Desktop version, for example 0.1.0"
        required: true
        type: string
      bundle_url:
        description: "HTTPS link to the zip of unsigned files (masked in the logs)"
        required: true
        type: string
      bundle_sha256:
        description: "SHA-256 of the zip"
        required: true
        type: string
      recipient_cert:
        description: "PEM certificate (RSA) the signed files are encrypted to"
        required: true
        type: string
      notarize:
        description: "Notarize and staple the macOS app and disk image"
        required: false
        type: boolean
        default: true
      kind:
        description: "app: the programs that go inside the installers, and the macOS app and disk image; installer: the Windows NSIS installers built around them"
        required: false
        type: choice
        options:
          - app
          - installer
        default: app
      platforms:
        description: "all: Windows and macOS; windows: no macOS job (Windows-only test builds)"
        required: false
        type: choice
        options:
          - all
          - windows
        default: all

permissions:
  contents: read

concurrency:
  group: sign-desktop
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
  KIND: ${{ inputs.kind || 'app' }}

jobs:
  macos:
    name: macOS (codesign inside-out, notarize, staple)
    # kind installer is Windows only; platforms windows leaves macOS out.
    if: inputs.kind != 'installer' && inputs.platforms != 'windows'
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    outputs:
      sums: ${{ steps.encrypt.outputs.sums }}
      notary: ${{ steps.verify.outputs.notary }}
    steps:
      - name: Fetch the bundle and check its SHA-256 (before anything else)
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version is not like 1.2.3 or 1.2.3-rc.1"; exit 1; }
          [[ "$KIND" = app ]] || { echo "::error::kind is app (installer has no macOS job)"; exit 1; }
          want=$(printf '%s' "$BUNDLE_SHA256" | tr 'A-F' 'a-f')
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bundle_sha256 is not 64 hex digits"; exit 1; }
          url=$(jq -r '.inputs.bundle_url' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$(printf '%s' "$url" | sed 's/%/%25/g')"
          [[ "$url" == https://* ]] || { echo "::error::bundle_url is not an https:// link"; exit 1; }
          curl --proto '=https' --tlsv1.2 -fsS --retry 3 --retry-all-errors -o "$RUNNER_TEMP/bundle.zip" "$url"
          got=$(shasum -a 256 "$RUNNER_TEMP/bundle.zip" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::the bundle's SHA-256 is $got, expected $want"
            exit 1
          fi
          echo "bundle: $(stat -f %z "$RUNNER_TEMP/bundle.zip") bytes, SHA-256 $got, as expected"

      - name: Check recipient_cert
        env:
          RECIPIENT_CERT: ${{ inputs.recipient_cert }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          printf '%s\n' "$RECIPIENT_CERT" > recipient.pem
          openssl version
          openssl x509 -in recipient.pem -noout -subject -enddate
          text=$(openssl x509 -in recipient.pem -noout -text)
          grep -q rsaEncryption <<< "$text" || { echo "::error::recipient_cert does not hold an RSA key"; exit 1; }
          openssl x509 -in recipient.pem -noout -checkend 3600 > /dev/null || { echo "::error::recipient_cert expires within the hour"; exit 1; }

      # Only the entitlements files, from this workflow's own commit. No
      # credentials are kept in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/desktop-signing
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: core

      - name: Take the disk image out of the bundle, and the app out of the disk image
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unzip -Z1 bundle.zip > entries.txt
          grep -qxF build-info.json entries.txt || { echo "::error::the bundle has no build-info.json"; exit 1; }
          unzip -p bundle.zip build-info.json > facts.json
          jq -e 'type == "object" and (.macos.dmg | type == "object") and (.macos.dmg.name | type == "string")
                 and (.macos.dmg.sha256 | type == "string") and (.macos.dmg.size | type == "number")' facts.json > /dev/null \
            || { echo "::error::build-info.json has no macos.dmg {name, sha256, size}"; exit 1; }
          dmgs=$(grep -E '^macos/[A-Za-z0-9][A-Za-z0-9._-]*\.dmg$' entries.txt || true)
          [ "$(printf '%s' "$dmgs" | grep -c .)" = 1 ] || { echo "::error::the bundle holds exactly one macos/<name>.dmg"; exit 1; }
          name=${dmgs#macos/}
          [[ "$name" != *..* ]] || { echo "::error::the disk image's name holds \"..\""; exit 1; }
          [ "$name" = "$(jq -r .macos.dmg.name facts.json)" ] || { echo "::error::build-info.json names another disk image than macos/$name"; exit 1; }
          mkdir -p in out/macos
          unzip -p bundle.zip "$dmgs" > "in/$name"
          sha=$(shasum -a 256 "in/$name" | cut -d' ' -f1)
          size=$(stat -f %z "in/$name")
          if [ "$sha" != "$(jq -r .macos.dmg.sha256 facts.json)" ] || [ "$size" != "$(jq -r .macos.dmg.size facts.json)" ]; then
            echo "::error::macos/$name does not match build-info.json"; exit 1
          fi
          echo "DMG_NAME=$name" >> "$GITHUB_ENV"
          echo "to sign: the app in $dmgs ($size bytes, SHA-256 $sha)"
          grep -vxF -e "$dmgs" -e build-info.json entries.txt | grep -v '^windows/' | grep -v '/$' | sed 's/^/ignored here: /' || true
          hdiutil imageinfo "in/$name" > /dev/null || { echo "::error::$name is not a disk image"; exit 1; }
          m="$RUNNER_TEMP/mnt-in"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$m" "in/$name" > /dev/null
          diskutil info -plist "$m" > volume.plist
          vol=$(plutil -extract VolumeName raw -o - volume.plist)
          # Names from the bundle reach GITHUB_ENV only when they are plain:
          # a line break there would set other variables for later steps.
          [[ "$vol" =~ ^[A-Za-z0-9][A-Za-z0-9\ ._-]{0,63}$ ]] || { echo "::error::the disk image's volume name is not letters, digits, spaces and . _ -"; exit 1; }
          echo "VOLUME_NAME=$vol" >> "$GITHUB_ENV"
          stage="$RUNNER_TEMP/app-stage"
          ditto "$m" "$stage"
          hdiutil detach "$m" > /dev/null || hdiutil detach -force "$m" > /dev/null
          rm -rf "$stage/.fseventsd" "$stage/.Trashes" "$stage/.Spotlight-V100"
          echo "volume \"$vol\":"
          ls -la "$stage"
          shopt -s nullglob
          apps=("$stage"/*.app)
          [ "${#apps[@]}" = 1 ] || { echo "::error::the disk image holds ${#apps[@]} apps at its top, not one"; exit 1; }
          app=${apps[0]}
          [[ "$(basename "$app")" =~ ^[A-Za-z0-9][A-Za-z0-9\ ._-]{0,63}\.app$ ]] || { echo "::error::the app's name is not letters, digits, spaces and . _ -"; exit 1; }
          plist="$app/Contents/Info.plist"
          bid=$(plutil -extract CFBundleIdentifier raw -o - "$plist") || { echo "::error::the app's Info.plist has no CFBundleIdentifier"; exit 1; }
          case "$bid" in
            io.6529.desktop) ;;
            io.6529.desktop.dev) echo "::warning::the app is a test build (io.6529.desktop.dev): sign it for testers only, never for a release" ;;
            *) echo "::error::the app's identifier is $bid, not io.6529.desktop or io.6529.desktop.dev"; exit 1 ;;
          esac
          exe=$(plutil -extract CFBundleExecutable raw -o - "$plist") || { echo "::error::the app's Info.plist names no CFBundleExecutable"; exit 1; }
          [[ "$exe" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::the app's executable is named \"$exe\""; exit 1; }
          [ -f "$app/Contents/MacOS/$exe" ] || { echo "::error::the app has no Contents/MacOS/$exe"; exit 1; }
          {
            echo "APP=$app"
            echo "APP_NAME=$(basename "$app")"
            echo "BUNDLE_ID=$bid"
            echo "APP_EXE=Contents/MacOS/$exe"
          } >> "$GITHUB_ENV"
          echo "app: $(basename "$app"), $bid, executable $exe, $(du -sm "$app" | cut -f1) MB"

      - name: Import the Developer ID certificate into a throwaway keychain (as build-mac.yml)
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/sign-desktop.keychain-db"
          p12="$RUNNER_TEMP/signing_certificate.p12"
          trap 'rm -f "$p12"' EXIT
          kpass=$(openssl rand -hex 24)
          echo "::add-mask::$kpass"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$p12"
          security create-keychain -p "$kpass" "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 7200 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # the search list, one keychain per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          ids=$(security find-identity -v -p codesigning "$keychain")
          echo "$ids"
          id=$(awk '/"Developer ID Application: / { print $2; exit }' <<< "$ids")
          [ -n "$id" ] || { echo "::error::the certificate holds no Developer ID Application identity"; exit 1; }
          n=$(awk '/"Developer ID Application: / { print $2 }' <<< "$ids" | sort -u | grep -c .)
          [ "$n" = 1 ] || { echo "::error::the certificate holds $n Developer ID Application identities, not one"; exit 1; }
          team=$(grep -F "$id" <<< "$ids" | sed -nE 's/.*"Developer ID Application: .* \(([A-Z0-9]{10})\)".*/\1/p' | head -n 1)
          [ -n "$team" ] || { echo "::error::no team identifier in the signing identity"; exit 1; }
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"

      - name: Codesign the app inside-out (libraries, programs, then the app; hardened runtime, secure timestamp)
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          ents="$GITHUB_WORKSPACE/core/.github/desktop-signing"
          for f in node c6529 app; do plutil -lint "$ents/$f.entitlements.plist"; done
          xattr -cr "$APP"
          # Tauri signed the app ad hoc; every signature is made again here.
          rm -rf "$APP/Contents/_CodeSignature"
          : > "$RUNNER_TEMP/libraries.txt"
          : > "$RUNNER_TEMP/programs.txt"
          while IFS= read -r -d '' f; do
            desc=$(file -b "$f")
            case "$desc" in Mach-O*) ;; *) continue ;; esac
            rel=${f#"$APP"/}
            [ "$rel" = "$APP_EXE" ] && continue
            case "$rel" in
              Contents/Resources/node/bin/node) printf '%s\tnode\t%s.node\n' "$rel" "$BUNDLE_ID" >> "$RUNNER_TEMP/programs.txt" ;;
              Contents/Resources/engine/c6529) printf '%s\tc6529\t%s.c6529\n' "$rel" "$BUNDLE_ID" >> "$RUNNER_TEMP/programs.txt" ;;
              Contents/Resources/engine/client-signer) printf '%s\tc6529\t%s.client-signer\n' "$rel" "$BUNDLE_ID" >> "$RUNNER_TEMP/programs.txt" ;;
              *)
                # Libraries only: dylibs and node addons (MH_BUNDLE).
                if grep -Eq 'dynamically linked shared library|bundle' <<< "$desc" && ! grep -q executable <<< "$desc"; then
                  printf '%s\n' "$rel" >> "$RUNNER_TEMP/libraries.txt"
                else
                  echo "::error::$rel is a program this workflow does not know ($desc); refusing to sign it"; exit 1
                fi
                ;;
            esac
          done < <(find "$APP" -type f -print0)
          for p in Contents/Resources/node/bin/node Contents/Resources/engine/c6529 Contents/Resources/engine/client-signer; do
            cut -f1 "$RUNNER_TEMP/programs.txt" | grep -qxF "$p" || { echo "::error::the app has no $p"; exit 1; }
          done
          echo "== libraries"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            echo "-- $rel"
            retry codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$APP/$rel"
          done < "$RUNNER_TEMP/libraries.txt"
          echo "== programs"
          while IFS=$'\t' read -r rel ent id; do
            echo "-- $rel ($id, $ent.entitlements.plist)"
            retry codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --identifier "$id" \
              --entitlements "$ents/$ent.entitlements.plist" --sign "$SIGN_IDENTITY" "$APP/$rel"
          done < "$RUNNER_TEMP/programs.txt"
          echo "== $APP_NAME ($BUNDLE_ID, app.entitlements.plist)"
          retry codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
            --entitlements "$ents/app.entitlements.plist" --sign "$SIGN_IDENTITY" "$APP"

      - name: Check every signature in the app (codesign --verify --deep --strict, team, runtime, timestamp, entitlements)
        run: |
          set -euo pipefail
          ents="$GITHUB_WORKSPACE/core/.github/desktop-signing"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The entitlement keys a file carries, sorted, one per line.
          keys_of() { plutil -convert json -o - "$1" 2> /dev/null | jq -r 'keys[]' | LC_ALL=C sort || true; }
          check() { # REL EXPECTED-ENTITLEMENTS-FILE (empty: none)
            local rel=$1 want=$2 f info got exp
            f="$APP/$1"
            [ "$rel" = app ] && f="$APP"
            codesign --verify --strict "$f" || { echo "::error::$rel: not validly signed"; exit 1; }
            info=$(codesign --display --verbose=2 "$f" 2>&1)
            grep -qx "TeamIdentifier=$TEAM_ID" <<< "$info" || { echo "::error::$rel: not signed with this Developer ID"; exit 1; }
            grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$info" || { echo "::error::$rel: no hardened runtime"; exit 1; }
            grep -q '^Timestamp=' <<< "$info" || { echo "::error::$rel: no secure timestamp"; exit 1; }
            codesign --display --entitlements - --xml "$f" > "$RUNNER_TEMP/ent.xml" 2> /dev/null || : > "$RUNNER_TEMP/ent.xml"
            if grep -q 'disable-library-validation' "$RUNNER_TEMP/ent.xml"; then echo "::error::$rel: signed with disable-library-validation"; exit 1; fi
            got=""; [ -s "$RUNNER_TEMP/ent.xml" ] && got=$(keys_of "$RUNNER_TEMP/ent.xml")
            exp=""; [ -n "$want" ] && exp=$(keys_of "$want")
            [ "$got" = "$exp" ] || { echo "::error::$rel: entitlements [$(paste -sd, - <<< "$got")], expected [$(paste -sd, - <<< "$exp")]"; exit 1; }
            echo "$rel: $(grep '^Identifier=' <<< "$info"), runtime, timestamped, entitlements [$(paste -sd, - <<< "$got")]"
          }
          while IFS= read -r rel; do [ -n "$rel" ] && check "$rel" ""; done < "$RUNNER_TEMP/libraries.txt"
          while IFS=$'\t' read -r rel ent _; do check "$rel" "$ents/$ent.entitlements.plist"; done < "$RUNNER_TEMP/programs.txt"
          check "$APP_EXE" "$ents/app.entitlements.plist"
          check app "$ents/app.entitlements.plist"
          # Every Mach-O in the app was signed here: none is left ad hoc.
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            codesign --display --verbose=2 "$f" 2>&1 | grep -qx "TeamIdentifier=$TEAM_ID" \
              || { echo "::error::${f#"$APP"/}: not signed with this Developer ID"; exit 1; }
          done < <(find "$APP" -type f -print0)

      - name: Notary helper (fails clearly while Apple refuses the team)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notary.sh" <<'NOTARY'
          # notarize FILE: submit, wait, print Apple's log, fail with the reason.
          notarize() {
            local f=$1 name rc=0 id status
            name=$(basename "$f")
            echo "== notarizing $name"
            xcrun notarytool submit "$f" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 1h --output-format json \
              > "$RUNNER_TEMP/notary.json" 2> "$RUNNER_TEMP/notary.err" || rc=$?
            cat "$RUNNER_TEMP/notary.err" >&2 || true
            cat "$RUNNER_TEMP/notary.json" || true
            echo
            if grep -qi 'required agreement is missing or has expired' "$RUNNER_TEMP/notary.err" "$RUNNER_TEMP/notary.json" 2> /dev/null; then
              echo "::error::Apple refused notarization of $name: the developer team's agreement is missing or has expired (HTTP 403). Every app of the team is refused until the team's Account Holder accepts the current agreement at developer.apple.com (Account, Agreements) or renews the membership. Nothing is wrong with the files. Run again once Apple accepts submissions; notarize=false gives codesigned files for tests only."
              exit 1
            fi
            id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json" 2> /dev/null || true)
            status=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json" 2> /dev/null || true)
            if [ -n "$id" ]; then
              if xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" "$RUNNER_TEMP/notary-log-$name.json" > /dev/null; then
                jq '{status, statusSummary, statusCode, issues}' "$RUNNER_TEMP/notary-log-$name.json"
              fi
            fi
            if [ "$rc" != 0 ] || [ "$status" != Accepted ]; then
              echo "::error::notarization of $name: ${status:-no result} (notarytool exit $rc). The messages above say why."
              exit 1
            fi
            echo "$name: Accepted by the notary service (submission $id)"
            echo "$name: notarized (submission $id), ticket stapled" >> "$RUNNER_TEMP/notary-summary.txt"
          }
          NOTARY
          : > "$RUNNER_TEMP/notary-summary.txt"

      - name: Notarize the app and staple it
        if: inputs.notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/notary.sh"
          # The app is stapled itself, so it opens offline once copied out
          # of the disk image; the disk image is notarized and stapled below.
          zip="$RUNNER_TEMP/${APP_NAME%.app}-app.zip"
          ditto -c -k --keepParent "$APP" "$zip"
          notarize "$zip"
          rm -f "$zip"
          retry xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: The disk image again around the app, codesigned
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          dmg="$RUNNER_TEMP/out/macos/$DMG_NAME"
          retry hdiutil create -volname "$VOLUME_NAME" -srcfolder "$RUNNER_TEMP/app-stage" -fs HFS+ -format UDZO -ov "$dmg"
          retry codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"

      - name: Notarize the disk image and staple it
        if: inputs.notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          # shellcheck source=/dev/null
          . "$RUNNER_TEMP/notary.sh"
          dmg="$RUNNER_TEMP/out/macos/$DMG_NAME"
          notarize "$dmg"
          retry xcrun stapler staple "$dmg"

      - name: Verify (spctl, stapler validate, codesign --verify --deep --strict on the app in the disk image)
        id: verify
        env:
          NOTARIZE: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/out/macos/$DMG_NAME"
          echo "== $DMG_NAME"
          codesign --verify --strict --verbose=2 "$dmg"
          if [ "$NOTARIZE" = true ]; then
            out=$(spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1) || { echo "$out"; echo "::error::spctl rejected $DMG_NAME"; exit 1; }
            echo "$out"
            grep -q 'source=Notarized Developer ID' <<< "$out" || { echo "::error::$DMG_NAME is not accepted as notarized"; exit 1; }
            xcrun stapler validate "$dmg"
          else
            echo "::warning::$DMG_NAME and its app are codesigned but not notarized (notarize=false): for tests only, never for a release"
          fi
          m="$RUNNER_TEMP/mnt-out"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$m" "$dmg" > /dev/null
          ls -la "$m"
          app="$m/$APP_NAME"
          echo "== $APP_NAME"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier=|Format=|CodeDirectory |Authority=|Timestamp=|TeamIdentifier=)'
          if [ "$NOTARIZE" = true ]; then
            xcrun stapler validate "$app"
            ok=""
            for n in 1 2 3 4 5; do
              if out=$(spctl -a -vv -t exec "$app" 2>&1) && grep -q 'source=Notarized Developer ID' <<< "$out"; then ok=1; break; fi
              echo "attempt $n: $out"
              sleep 20
            done
            echo "$out"
            [ -n "$ok" ] || { echo "::error::Gatekeeper does not accept $APP_NAME as notarized"; exit 1; }
          fi
          hdiutil detach "$m" > /dev/null || hdiutil detach -force "$m" > /dev/null
          { echo "notary<<NOTARY_EOF"; cat "$RUNNER_TEMP/notary-summary.txt"; echo "NOTARY_EOF"; } >> "$GITHUB_OUTPUT"

      - name: SHA-256 of the signed files, and encrypt them to recipient_cert
        id: encrypt
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done > ../macos.sums
          cat ../macos.sums
          { echo "sums<<SUMS_EOF"; cat ../macos.sums; echo "SUMS_EOF"; } >> "$GITHUB_OUTPUT"
          tarball="../desktop-$VERSION-macos-signed.tar"
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -cf "$tarball" ./*
          mkdir -p ../upload
          openssl smime -encrypt -binary -aes256 -outform DER -in "$tarball" \
            -out "../upload/desktop-$VERSION-macos-signed.tar.p7m" ../recipient.pem
          rm -f "$tarball"
          ls -l ../upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ inputs.version }}-macos-signed
          path: ${{ runner.temp }}/upload/desktop-${{ inputs.version }}-macos-signed.tar.p7m
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Delete the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          security default-keychain -s login.keychain || true
          rm -f "$RUNNER_TEMP/signing_certificate.p12"

  windows:
    name: Windows (AzureSignTool)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The NSIS uninstaller: the one x86 program taken, under exactly this name.
      UNINSTALLER: nsis/uninstall.exe
    defaults:
      run:
        shell: pwsh
    outputs:
      sums: ${{ steps.encrypt.outputs.sums }}
      authenticode: ${{ steps.verify.outputs.authenticode }}
    steps:
      - name: Fetch the bundle and check its SHA-256 (before anything else)
        run: |
          if ($env:VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw 'version is not like 1.2.3 or 1.2.3-rc.1' }
          if ($env:KIND -cnotmatch '^(app|installer)$') { throw 'kind is app or installer' }
          $want = $env:BUNDLE_SHA256.ToLowerInvariant()
          if ($want -cnotmatch '^[0-9a-f]{64}$') { throw 'bundle_sha256 is not 64 hex digits' }
          $url = (Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json).inputs.bundle_url
          Write-Output "::add-mask::$($url.Replace('%', '%25'))"
          if (-not $url.StartsWith('https://')) { throw 'bundle_url is not an https:// link' }
          $zip = Join-Path $env:RUNNER_TEMP 'bundle.zip'
          & curl.exe --proto '=https' --tlsv1.2 -fsS --retry 3 --retry-all-errors -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "the download failed (curl exit $LASTEXITCODE)" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "the bundle's SHA-256 is $got, expected $want" }
          Write-Output "bundle: $((Get-Item -LiteralPath $zip).Length) bytes, SHA-256 $got, as expected"

      - name: Check recipient_cert
        shell: bash
        env:
          RECIPIENT_CERT: ${{ inputs.recipient_cert }}
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$RUNNER_TEMP")"
          printf '%s\n' "$RECIPIENT_CERT" > recipient.pem
          openssl version
          openssl x509 -in recipient.pem -noout -subject -enddate
          text=$(openssl x509 -in recipient.pem -noout -text)
          grep -q rsaEncryption <<< "$text" || { echo "::error::recipient_cert does not hold an RSA key"; exit 1; }
          openssl x509 -in recipient.pem -noout -checkend 3600 > /dev/null || { echo "::error::recipient_cert expires within the hour"; exit 1; }

      - name: Take the Windows files out of the bundle
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $temp = $env:RUNNER_TEMP
          $out = Join-Path $temp 'out'
          $vendor = Join-Path $temp 'vendor'
          New-Item -ItemType Directory -Force -Path $out, $vendor | Out-Null
          # A program file (PE), by its headers: its machine (0x8664 x86-64, 0x14C x86), or -1.
          function Get-PeMachine([string]$path) {
            $h = New-Object byte[] 4096
            $fs = [System.IO.File]::OpenRead($path)
            try { [void]$fs.Read($h, 0, $h.Length) } finally { $fs.Dispose() }
            $pe = [BitConverter]::ToInt32($h, 0x3C)
            if ($h[0] -eq 0x4D -and $h[1] -eq 0x5A -and $pe -ge 0 -and $pe -le 4090 -and [BitConverter]::ToUInt32($h, $pe) -eq 0x00004550) { return [int][BitConverter]::ToUInt16($h, $pe + 4) }
            return -1
          }
          $uninstaller = $env:UNINSTALLER
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $temp 'bundle.zip'))
          try {
            $facts = $null
            $info = $zip.GetEntry('build-info.json')
            if ($null -ne $info) {
              $r = New-Object System.IO.StreamReader($info.Open())
              try { $facts = $r.ReadToEnd() | ConvertFrom-Json } finally { $r.Dispose() }
            }
            $listed = @{}
            if ($null -ne $facts -and $null -ne $facts.windows) {
              foreach ($f in @($facts.windows.files)) {
                $p = [string]$f.path
                # Folders and names of letters, digits and . _ - + @; no "..", no backslash, no leading slash.
                if ($p -cnotmatch '^[A-Za-z0-9@_+-][A-Za-z0-9@._+-]*(/[A-Za-z0-9@_+-][A-Za-z0-9@._+-]*)*\.(exe|dll|node)$' -or $p.Contains('..')) { throw "build-info.json lists a file named `"$p`"" }
                if ([string]$f.sha256 -cnotmatch '^[0-9a-f]{64}$') { throw "build-info.json: $p has no SHA-256" }
                if ($f.role -cne 'sign' -and $f.role -cne 'vendor') { throw "build-info.json: $p has role `"$($f.role)`" (sign or vendor)" }
                if ($f.role -ceq 'vendor' -and $p -cne 'node/node.exe') { throw "build-info.json: only node/node.exe may be a vendor file, not $p" }
                if ($p -ceq 'node/node.exe' -and $f.role -cne 'vendor') { throw "build-info.json: node/node.exe is the official Node.js build: role vendor, checked and left as it is" }
                if ($p -ceq $uninstaller -and $f.role -cne 'sign') { throw "build-info.json: $uninstaller has role `"$($f.role)`" (sign)" }
                if ($listed.ContainsKey($p)) { throw "build-info.json lists $p twice" }
                $listed[$p] = $f
              }
            }
            if ($env:KIND -eq 'app') {
              if ($null -eq $facts) { throw 'an app bundle holds build-info.json' }
              if ($listed.Count -lt 1) { throw 'build-info.json lists no Windows files (windows.files)' }
              $signs = @($listed.Values | Where-Object { $_.role -ceq 'sign' })
              if (@($signs | Where-Object { $_.path -cmatch '^[^/]+\.exe$' }).Count -ne 1) { throw "build-info.json lists not exactly one app program (a role sign .exe at the top)" }
              foreach ($need in @('engine/c6529.exe', 'engine/client-signer.exe')) {
                if (-not $listed.ContainsKey($need) -or $listed[$need].role -cne 'sign') { throw "build-info.json does not list $need to sign" }
              }
              if (-not $listed.ContainsKey('node/node.exe')) { throw 'build-info.json does not list node/node.exe (vendor)' }
              foreach ($e in $zip.Entries) {
                $n = $e.FullName
                if ($n.EndsWith('/')) { continue }
                if (-not $n.StartsWith('windows/')) { if ($n -cne 'build-info.json' -and -not $n.StartsWith('macos/')) { Write-Output "ignored here: $n" }; continue }
                $p = $n.Substring(8)
                $isProgram = $p -match '\.(exe|dll|node|sys|ocx|scr|cpl|msi)$'
                if (-not $listed.ContainsKey($p)) {
                  if ($isProgram) { throw "the bundle holds windows/$p, which build-info.json does not list" }
                  Write-Output "ignored here: $n"; continue
                }
                $f = $listed[$p]
                $dest = if ($f.role -ceq 'vendor') { Join-Path $vendor $p } else { Join-Path $out (Join-Path 'windows' $p) }
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, $dest, $false)
                $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLowerInvariant()
                if ($sha -ne $f.sha256 -or (Get-Item -LiteralPath $dest).Length -ne [long]$f.size) { throw "windows/$p does not match build-info.json" }
                $machine = Get-PeMachine $dest
                if ($p -ceq $uninstaller) {
                  if ($machine -ne 0x14C) { throw "windows/$p is not the x86 NSIS uninstaller" }
                } elseif ($machine -ne 0x8664) { throw "windows/$p is not an x86-64 Windows program file" }
                Write-Output ("{0}: windows/{1}" -f $(if ($f.role -ceq 'vendor') { 'to check (vendor)' } else { 'to sign' }), $p)
                $f | Add-Member -NotePropertyName found -NotePropertyValue $true -Force
              }
              foreach ($f in $listed.Values) { if (-not $f.found) { throw "build-info.json lists $($f.path), and the bundle has no windows/$($f.path)" } }
            } else {
              foreach ($e in $zip.Entries) {
                $n = $e.FullName
                if ($n.EndsWith('/')) { continue }
                if ($n -cmatch '^windows/[A-Za-z0-9][A-Za-z0-9._-]*-setup\.exe$') {
                  $dest = Join-Path $out (Join-Path 'windows' $e.Name)
                  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest) | Out-Null
                  [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, $dest, $false)
                  $h = New-Object byte[] 4096
                  $fs = [System.IO.File]::OpenRead($dest)
                  try { [void]$fs.Read($h, 0, $h.Length) } finally { $fs.Dispose() }
                  $pe = [BitConverter]::ToInt32($h, 0x3C)
                  if (-not ($h[0] -eq 0x4D -and $h[1] -eq 0x5A -and $pe -ge 0 -and $pe -le 4090 -and [BitConverter]::ToUInt32($h, $pe) -eq 0x00004550)) { throw "$n is not a Windows program" }
                  Write-Output "to sign: $n"
                } elseif ($n -cne 'build-info.json') {
                  Write-Output "ignored here: $n"
                }
              }
              if (@(Get-ChildItem -LiteralPath (Join-Path $out 'windows') -Filter '*-setup.exe' -ErrorAction SilentlyContinue).Count -lt 1) { throw 'an installer bundle holds at least one windows/<name>-setup.exe' }
            }
          } finally { $zip.Dispose() }
          if ($null -ne $facts -and $null -ne $facts.windows) {
            $facts.windows | ConvertTo-Json -Depth 5 | Out-File -FilePath (Join-Path $temp 'windows-facts.json') -Encoding utf8
          }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install AzureSignTool 6.0.1 (as sign-windows.yml)
        run: |
          dotnet tool install --global AzureSignTool --version 6.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Sign each file (Azure Key Vault certificate, sha256, RFC 3161 timestamp)
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CERT_NAME: ${{ secrets.CERT_NAME }}
        run: |
          # The flags of scripts/windows-sign-hook.cjs, passed as a list.
          $common = @(
            'sign',
            '--azure-key-vault-url', $env:AZURE_KEY_VAULT_URL,
            '--azure-key-vault-client-id', $env:AZURE_CLIENT_ID,
            '--azure-key-vault-client-secret', $env:AZURE_CLIENT_SECRET,
            '--azure-key-vault-tenant-id', $env:AZURE_TENANT_ID,
            '--azure-key-vault-certificate', $env:CERT_NAME,
            '--file-digest', 'sha256',
            '--timestamp-rfc3161', 'http://timestamp.digicert.com',
            '--timestamp-digest', 'sha256'
          )
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'out') -Recurse -File | Sort-Object FullName)
          foreach ($f in $files) {
            $before = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($before.Status -ne 'NotSigned') { Write-Output "::warning::$($f.Name) already carries a signature ($($before.Status), $($before.SignerCertificate.Subject)); it is replaced" }
            Write-Output "== $($f.FullName.Substring($env:RUNNER_TEMP.Length + 5))"
            & azuresigntool @common $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed on $($f.Name) (exit $LASTEXITCODE)" }
          }

      - name: Verify (signtool verify /pa /all, Get-AuthenticodeSignature; node.exe by its vendor; the installer's contents)
        id: verify
        run: |
          $temp = $env:RUNNER_TEMP
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Parent.Name -match '^[0-9]+([.][0-9]+)+$' } |
            Sort-Object { [version]($_.Directory.Parent.Name) } | Select-Object -Last 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found in the Windows SDK' }
          Write-Output "signtool: $($signtool.FullName)"
          $lines = @()
          $thumbs = @{}
          $files = @(Get-ChildItem -LiteralPath (Join-Path $temp 'out') -Recurse -File | Sort-Object FullName)
          foreach ($f in $files) {
            $rel = $f.FullName.Substring($temp.Length + 5).Replace('\', '/')
            & $signtool.FullName verify /pa /all $f.FullName | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "${rel}: signtool verify /pa /all failed (exit $LASTEXITCODE)" }
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Output ('{0}: {1} ({2})' -f $rel, $s.Status, $s.StatusMessage)
            Write-Output ('  signer:     {0}' -f $s.SignerCertificate.Subject)
            Write-Output ('  issuer:     {0}' -f $s.SignerCertificate.Issuer)
            Write-Output ('  thumbprint: {0}' -f $s.SignerCertificate.Thumbprint)
            Write-Output ('  timestamp:  {0}' -f $s.TimeStamperCertificate.Subject)
            if ($s.Status -ne 'Valid') { throw "${rel}: the signature is $($s.Status)" }
            if ($null -eq $s.TimeStamperCertificate) { throw "${rel}: the signature has no timestamp" }
            $thumbs[$s.SignerCertificate.Thumbprint] = $true
            $lines += "${rel}: Authenticode Valid, timestamped, signer $($s.SignerCertificate.Subject)"
          }
          if ($thumbs.Count -ne 1) { throw "the signed files carry $($thumbs.Count) different certificates, not one" }
          $ours = @($thumbs.Keys)[0]
          # node.exe: the official Node.js build, signed by its vendor; checked, not changed, not returned.
          $node = Join-Path $temp 'vendor\node\node.exe'
          if (Test-Path -LiteralPath $node) {
            & $signtool.FullName verify /pa /all $node | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "node/node.exe: signtool verify /pa /all failed (exit $LASTEXITCODE)" }
            $s = Get-AuthenticodeSignature -LiteralPath $node
            Write-Output ('node/node.exe (vendor): {0}, signer {1}' -f $s.Status, $s.SignerCertificate.Subject)
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch '(^|, )O=OpenJS Foundation(,|$)') { throw 'node/node.exe is not validly signed by the OpenJS Foundation' }
            $lines += "node/node.exe: Authenticode Valid by its vendor, $($s.SignerCertificate.Subject), left as it is"
          }
          if ($env:KIND -eq 'installer') {
            # Each installer must hold the files a kind app run signed, byte for byte.
            $factsFile = Join-Path $temp 'windows-facts.json'
            if (Test-Path -LiteralPath $factsFile) {
              $facts = Get-Content -Raw -LiteralPath $factsFile | ConvertFrom-Json
              if (@($facts.files).Count -lt 1) { throw 'build-info.json lists no Windows files (windows.files): nothing to check the installers against' }
              # Facts given: the check is required, so a missing or failing 7-Zip fails the run.
              $seven = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
              if (-not (Test-Path -LiteralPath $seven)) { throw '7-Zip is not on this runner: the installers cannot be checked against build-info.json' }
              foreach ($setup in @(Get-ChildItem -LiteralPath (Join-Path $temp 'out\windows') -Filter '*-setup.exe')) {
                $x = Join-Path $temp ("x-" + $setup.BaseName)
                & $seven x -y "-o$x" $setup.FullName | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "7-Zip could not read $($setup.Name) (exit $LASTEXITCODE): its contents cannot be checked against build-info.json" }
                $inside = @{}
                foreach ($g in @(Get-ChildItem -LiteralPath $x -Recurse -File)) { $inside[(Get-FileHash -Algorithm SHA256 -LiteralPath $g.FullName).Hash.ToLowerInvariant()] = $g.FullName }
                $checked = 0
                foreach ($f in @($facts.files)) {
                  # makensis stores the uninstaller in a form 7-Zip does not extract (header comment).
                  if ([string]$f.path -ceq $env:UNINSTALLER) { Write-Output "$($setup.Name): $($env:UNINSTALLER) (signed, SHA-256 $($f.sha256)) is not extractable with 7-Zip; not checked here"; continue }
                  $checked++
                  if (-not $inside.ContainsKey([string]$f.sha256)) { throw "$($setup.Name) does not hold $($f.path) as signed (SHA-256 $($f.sha256))" }
                  if ($f.role -ceq 'sign') {
                    $s = Get-AuthenticodeSignature -LiteralPath $inside[[string]$f.sha256]
                    if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Thumbprint -ne $ours) { throw "$($setup.Name): $($f.path) inside it is not signed with the installer's certificate" }
                  }
                }
                $lines += "$($setup.Name): holds the $checked files of build-info.json 7-Zip can extract, byte for byte, signed"
              }
            } else {
              Write-Output "::notice::no build-info.json in the bundle: the installers' contents are not checked here"
            }
          }
          "authenticode<<AUTH_EOF`n$($lines -join "`n")`nAUTH_EOF" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: SHA-256 of the signed files, and encrypt them to recipient_cert
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$RUNNER_TEMP")/out"
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do
            printf '%s  %s\n' "$(sha256sum -b "$f" | cut -d' ' -f1)" "$f"
          done > ../windows.sums
          cat ../windows.sums
          { echo "sums<<SUMS_EOF"; cat ../windows.sums; echo "SUMS_EOF"; } >> "$GITHUB_OUTPUT"
          tarball="../desktop-$VERSION-windows-signed.tar"
          tar -cf "$tarball" ./*
          mkdir -p ../upload
          openssl smime -encrypt -binary -aes256 -outform DER -in "$tarball" \
            -out "../upload/desktop-$VERSION-windows-signed.tar.p7m" ../recipient.pem
          rm -f "$tarball"
          ls -l ../upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ inputs.version }}-windows-signed
          path: ${{ runner.temp }}/upload/desktop-${{ inputs.version }}-windows-signed.tar.p7m
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  sums:
    name: SHA256SUMS
    needs: [macos, windows]
    # kind installer and platforms windows have no macOS job.
    if: >-
      always() && needs.windows.result == 'success'
      && (needs.macos.result == 'success'
          || ((inputs.kind == 'installer' || inputs.platforms == 'windows') && needs.macos.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SHA256SUMS of every signed file
        env:
          MACOS_SUMS: ${{ needs.macos.outputs.sums }}
          WINDOWS_SUMS: ${{ needs.windows.outputs.sums }}
          NOTARY: ${{ needs.macos.outputs.notary }}
          AUTHENTICODE: ${{ needs.windows.outputs.authenticode }}
          # Also set for the whole workflow; named here because the checks below depend on them.
          VERSION: ${{ inputs.version }}
          KIND: ${{ inputs.kind || 'app' }}
          PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sums"
          s="$RUNNER_TEMP/sums/SHA256SUMS"
          printf '%s\n%s\n' "$MACOS_SUMS" "$WINDOWS_SUMS" | sed '/^$/d' | LC_ALL=C sort -k2 > "$s"
          if grep -vE '^[0-9a-f]{64}  [A-Za-z0-9@][A-Za-z0-9@._+/-]*$' "$s"; then
            echo "::error::a malformed line in SHA256SUMS (above)"
            exit 1
          fi
          names=$(cut -c67- "$s")
          if [ "$KIND" = installer ]; then
            grep -qE '^windows/[^/]+-setup\.exe$' <<< "$names" || { echo "::error::SHA256SUMS lists no installer"; exit 1; }
          else
            if [ "$PLATFORMS" = windows ]; then
              [ "$(grep -cE '^macos/' <<< "$names" || true)" = 0 ] || { echo "::error::a Windows-only run lists macOS files"; exit 1; }
            else
              [ "$(grep -cE '^macos/[^/]+\.dmg$' <<< "$names" || true)" = 1 ] || { echo "::error::SHA256SUMS does not list one disk image"; exit 1; }
            fi
            for f in windows/engine/c6529.exe windows/engine/client-signer.exe; do
              grep -qxF "$f" <<< "$names" || { echo "::error::SHA256SUMS does not list $f"; exit 1; }
            done
            [ "$(grep -cE '^windows/[^/]+\.exe$' <<< "$names" || true)" = 1 ] || { echo "::error::SHA256SUMS does not list one app program"; exit 1; }
          fi
          cat "$s"
          {
            echo "### 6529 Desktop $VERSION, signed ($KIND, $PLATFORMS)"
            echo
            echo '```'
            cat "$s"
            echo '```'
            echo
            printf '%s\n%s\n' "$NOTARY" "$AUTHENTICODE" | sed '/^$/d; s/^/- /'
            echo
            echo "The signed files are this run's artifacts, encrypted to recipient_cert."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ inputs.version }}-SHA256SUMS
          path: ${{ runner.temp }}/sums/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
