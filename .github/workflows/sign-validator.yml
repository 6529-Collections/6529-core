# Signs the 6529 validator's macOS and Windows release files with 6529's
# signing identities: the Developer ID certificate and Apple notarization of
# build-mac.yml, and the Azure Key Vault certificate of sign-windows.yml.
#
# Why here: those identities live only in this repository's secrets. The
# validator (a command-line program with a local web UI) is built and checked
# in its own repository; only the signing happens here. The owner asked for
# this workflow on 2026-10-31.
#
# Started by hand only (workflow_dispatch):
#   version         the validator's version, for example 0.1.0 (names the results)
#   bundle_url      an HTTPS link (a pre-signed URL) to a zip of the unsigned files:
#                     aarch64-apple-darwin/validator
#                     x86_64-apple-darwin/validator
#                     x86_64-pc-windows-msvc/validator.exe
#                     x86_64-pc-windows-msvc/<name>.msi    (optional, any number)
#                   other entries (such as build-info.json) are listed and ignored.
#                   The link is masked in the logs.
#   bundle_sha256   the zip's SHA-256, checked before anything else
#   recipient_cert  a PEM X.509 certificate with an RSA key. The signed files
#                   are encrypted to it, because this repository is public, and
#                   so are its logs and run artifacts
#   notarize        false to codesign without notarizing (default true)
#   kind            binaries (default): the bundle above.
#                   installers: the installers the validator's release builds
#                   from programs a binaries run signed, so that they hold
#                   signed programs. The bundle is then
#                     macos/<name>.dmg                     one disk image holding one .app
#                     x86_64-pc-windows-msvc/<name>.msi    one or more
#                   and other entries are listed and ignored.
#                   setup (Windows only): Setup.exe, the WiX Burn bundle the
#                   release builds around a .msi an installers run signed:
#                     x86_64-pc-windows-msvc/<name>.exe    one or more (not validator.exe)
#                   Burn runs the installation from an elevated copy of its
#                   engine, so the engine is signed on its own first: `wix
#                   burn detach`, sign the engine, `wix burn reattach`, sign
#                   the whole file (WiX 5.0.2). The results are each signed
#                   Setup.exe and its signed engine, <name>.engine.exe.
#
# macOS (macos-latest): the certificate is imported as build-mac.yml imports
# it, into a throwaway keychain that is deleted at the end.
#   binaries: each binary is codesigned (hardened runtime, secure timestamp)
#   and put with a README into one .dmg per architecture.
#   installers: every program inside the .app must already carry this
#   Developer ID's signature (hardened runtime, timestamp), and stays byte
#   for byte as it is; the .app itself is codesigned (hardened runtime,
#   secure timestamp) and the disk image is made again around it, with the
#   rest of its contents unchanged.
#   Each .dmg is codesigned, notarized (notarytool) and stapled, then checked
#   with spctl and codesign --verify --strict.
# Windows (windows-latest): AzureSignTool 6.0.1 signs each .exe and .msi with
# the flags of scripts/windows-sign-hook.cjs (sha256, RFC 3161 timestamp), and
# Get-AuthenticodeSignature checks each one.
#
# Results, kept 14 days as this run's artifacts:
#   validator-<version>-macos-signed     a .tar of the signed files, encrypted
#                                        to recipient_cert (.tar.p7m)
#   validator-<version>-windows-signed   the same for Windows
#   validator-<version>-SHA256SUMS       the SHA-256 of every signed file
# To decrypt:
#   openssl smime -decrypt -binary -inform DER -in <file>.tar.p7m -inkey <key> -out <file>.tar
#
# It publishes nothing: no release, no tag, no upload to the desktop app's
# distribution, and no notifications. Secrets reach only the steps that use
# them and are never printed. The files it signs are never run here: a
# compromised build must not run where the signing secrets are.
#
# Trust: whoever starts it chooses what 6529's identities sign. That takes
# write access to this repository, which already reaches these secrets
# through the other workflows. bundle_sha256 protects the transfer, not the
# provenance: the operator takes the bundle from the validator repository's
# release workflow (its build artifacts, checked against their
# build-info.json) and runs the signed programs after this run.

name: Sign validator

run-name: Sign validator ${{ inputs.version }} (${{ inputs.kind || 'binaries' }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Validator version, for example 0.1.0"
        required: true
        type: string
      bundle_url:
        description: "HTTPS link to the zip of unsigned files (masked in the logs)"
        required: true
        type: string
      bundle_sha256:
        description: "SHA-256 of the zip"
        required: true
        type: string
      recipient_cert:
        description: "PEM certificate (RSA) the signed files are encrypted to"
        required: true
        type: string
      notarize:
        description: "Notarize and staple the macOS disk images"
        required: false
        type: boolean
        default: true
      kind:
        description: "binaries: the bare programs; installers: a .dmg (one .app) and .msi files built from programs signed here; setup: Setup.exe (Burn) around a .msi signed here"
        required: false
        type: choice
        options:
          - binaries
          - installers
          - setup
        default: binaries

permissions:
  contents: read

concurrency:
  group: sign-validator
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
  KIND: ${{ inputs.kind || 'binaries' }}

jobs:
  macos:
    name: macOS (codesign, notarize, staple)
    # kind setup is Windows only.
    if: inputs.kind != 'setup'
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      sums: ${{ steps.encrypt.outputs.sums }}
      notary: ${{ steps.notarize.outputs.notary }}
    steps:
      - name: Fetch the bundle and check its SHA-256 (before anything else)
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version is not like 1.2.3 or 1.2.3-rc.1"; exit 1; }
          [[ "$KIND" =~ ^(binaries|installers)$ ]] || { echo "::error::kind is binaries or installers (setup has no macOS job)"; exit 1; }
          want=$(printf '%s' "$BUNDLE_SHA256" | tr 'A-F' 'a-f')
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bundle_sha256 is not 64 hex digits"; exit 1; }
          url=$(jq -r '.inputs.bundle_url' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$(printf '%s' "$url" | sed 's/%/%25/g')"
          [[ "$url" == https://* ]] || { echo "::error::bundle_url is not an https:// link"; exit 1; }
          curl --proto '=https' --tlsv1.2 -fsS --retry 3 --retry-all-errors -o "$RUNNER_TEMP/bundle.zip" "$url"
          got=$(shasum -a 256 "$RUNNER_TEMP/bundle.zip" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "::error::the bundle's SHA-256 is $got, expected $want"
            exit 1
          fi
          echo "bundle: $(stat -f %z "$RUNNER_TEMP/bundle.zip") bytes, SHA-256 $got, as expected"

      - name: Check recipient_cert
        env:
          RECIPIENT_CERT: ${{ inputs.recipient_cert }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          printf '%s\n' "$RECIPIENT_CERT" > recipient.pem
          openssl version
          openssl x509 -in recipient.pem -noout -subject -enddate
          text=$(openssl x509 -in recipient.pem -noout -text)
          grep -q rsaEncryption <<< "$text" || { echo "::error::recipient_cert does not hold an RSA key"; exit 1; }
          openssl x509 -in recipient.pem -noout -checkend 3600 > /dev/null || { echo "::error::recipient_cert expires within the hour"; exit 1; }

      - name: Take the macOS binaries out of the bundle
        if: inputs.kind != 'installers'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unzip -Z1 bundle.zip > entries.txt
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            grep -qxF "$t/validator" entries.txt || { echo "::error::the bundle has no $t/validator"; exit 1; }
            mkdir -p "out/$t"
            unzip -p bundle.zip "$t/validator" > "out/$t/validator"
            chmod 0755 "out/$t/validator"
            echo "to sign: $t/validator"
          done
          grep -vxE '(aarch64|x86_64)-apple-darwin/validator' entries.txt | grep -v '/$' | sed 's/^/ignored here: /' || true
          [ "$(lipo -archs out/aarch64-apple-darwin/validator)" = arm64 ] || { echo "::error::aarch64-apple-darwin/validator is not an arm64 program"; exit 1; }
          [ "$(lipo -archs out/x86_64-apple-darwin/validator)" = x86_64 ] || { echo "::error::x86_64-apple-darwin/validator is not an x86_64 program"; exit 1; }

      - name: "Installers: take the disk image out of the bundle"
        if: inputs.kind == 'installers'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unzip -Z1 bundle.zip > entries.txt
          dmgs=$(grep -E '^macos/[A-Za-z0-9][A-Za-z0-9._-]*\.dmg$' entries.txt || true)
          [ "$(printf '%s' "$dmgs" | grep -c .)" = 1 ] || { echo "::error::an installers bundle holds exactly one macos/<name>.dmg"; exit 1; }
          name=${dmgs#macos/}
          mkdir -p in out
          unzip -p bundle.zip "$dmgs" > "in/$name"
          echo "DMG_NAME=$name" >> "$GITHUB_ENV"
          echo "to sign: the app in $dmgs"
          grep -vxF "$dmgs" entries.txt | grep -v '/$' | sed 's/^/ignored here: /' || true
          hdiutil imageinfo "in/$name" > /dev/null || { echo "::error::$name is not a disk image"; exit 1; }

      - name: Import the Developer ID certificate into a throwaway keychain (as build-mac.yml)
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/sign-validator.keychain-db"
          p12="$RUNNER_TEMP/signing_certificate.p12"
          trap 'rm -f "$p12"' EXIT
          kpass=$(openssl rand -hex 24)
          echo "::add-mask::$kpass"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$p12"
          security create-keychain -p "$kpass" "$keychain"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 7200 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$kpass" "$keychain"
          security import "$p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kpass" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # the search list, one keychain per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          ids=$(security find-identity -v -p codesigning "$keychain")
          echo "$ids"
          id=$(awk '/"Developer ID Application: / { print $2; exit }' <<< "$ids")
          [ -n "$id" ] || { echo "::error::the certificate holds no Developer ID Application identity"; exit 1; }
          echo "SIGN_IDENTITY=$id" >> "$GITHUB_ENV"

      - name: Codesign the binaries (hardened runtime, secure timestamp)
        if: inputs.kind != 'installers'
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            b="$RUNNER_TEMP/out/$t/validator"
            echo "== $t/validator"
            retry codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
              --identifier io.6529.validator --sign "$SIGN_IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
            info=$(codesign --display --verbose=2 "$b" 2>&1)
            grep -E '^(Identifier=|Format=|CodeDirectory |Authority=|Timestamp=|TeamIdentifier=)' <<< "$info"
            grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$info" || { echo "::error::$t/validator: no hardened runtime"; exit 1; }
            grep -q '^Timestamp=' <<< "$info" || { echo "::error::$t/validator: no secure timestamp"; exit 1; }
          done

      - name: One disk image per architecture, with a README, codesigned
        if: inputs.kind != 'installers'
        env:
          NOTARIZE: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          signed="signed with 6529's Developer ID"
          [ "$NOTARIZE" = true ] && signed="$signed and notarized by Apple"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            case "$t" in aarch64-*) arch="Apple silicon" ;; *) arch="Intel" ;; esac
            stage="$RUNNER_TEMP/dmg/$t"
            mkdir -p "$stage"
            cp -p "$RUNNER_TEMP/out/$t/validator" "$stage/validator"
            printf '%s\n' \
              "6529 validator $VERSION for macOS ($arch)" \
              "" \
              "  validator    the program, $signed" \
              "  README.txt   this file" \
              "" \
              "To install it, copy the program onto your PATH, for example:" \
              "" \
              "  sudo mkdir -p /usr/local/bin" \
              "  sudo install -m 0755 \"/Volumes/6529 validator $VERSION/validator\" /usr/local/bin/validator" \
              "  validator --help" \
              "" \
              "The install guide and how to check a download are in docs/install/ of the" \
              "release (start with docs/install/README.md)." \
              "One key, one machine: never run the same validator key on two machines." \
              "6529 will never DM you or ask for a seed phrase." > "$stage/README.txt"
            dmg="$RUNNER_TEMP/out/validator-$VERSION-$t.dmg"
            retry hdiutil create -volname "6529 validator $VERSION" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
            retry codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$dmg"
            codesign --verify --strict --verbose=2 "$dmg"
          done

      - name: "Installers: codesign the app (its programs already signed here), and the disk image again around it"
        if: inputs.kind == 'installers'
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          team=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$SIGN_IDENTITY" | sed -nE 's/.*"Developer ID Application: .* \(([A-Z0-9]{10})\)".*/\1/p' | head -n 1)
          [ -n "$team" ] || { echo "::error::no team identifier in the signing identity"; exit 1; }
          m="$RUNNER_TEMP/mnt-in"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$m" "$RUNNER_TEMP/in/$DMG_NAME" > /dev/null
          diskutil info -plist "$m" > "$RUNNER_TEMP/volume.plist"
          vol=$(plutil -extract VolumeName raw -o - "$RUNNER_TEMP/volume.plist")
          [ -n "$vol" ] || { echo "::error::the disk image's volume has no name"; exit 1; }
          stage="$RUNNER_TEMP/app-stage"
          ditto "$m" "$stage"
          hdiutil detach "$m" > /dev/null || hdiutil detach -force "$m" > /dev/null
          rm -rf "$stage/.fseventsd" "$stage/.Trashes" "$stage/.Spotlight-V100"
          echo "volume \"$vol\":"
          ls -la "$stage"
          shopt -s nullglob
          apps=("$stage"/*.app)
          [ "${#apps[@]}" = 1 ] || { echo "::error::the disk image holds ${#apps[@]} apps at its top, not one"; exit 1; }
          app=${apps[0]}
          echo "APP_NAME=$(basename "$app")" >> "$GITHUB_ENV"
          xattr -cr "$app"
          # Every program inside must already carry this Developer ID's
          # signature, each architecture: they are not signed again, so they
          # stay byte for byte the release's programs.
          n=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            n=$((n + 1))
            for a in $(lipo -archs "$f"); do
              rel=${f#"$app"/}
              codesign --verify --strict -a "$a" "$f" || { echo "::error::$rel ($a): not validly signed"; exit 1; }
              info=$(codesign --display --verbose=2 -a "$a" "$f" 2>&1)
              grep -qx "TeamIdentifier=$team" <<< "$info" || { echo "::error::$rel ($a): not signed with this Developer ID (sign it with kind binaries first)"; exit 1; }
              grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$info" || { echo "::error::$rel ($a): no hardened runtime"; exit 1; }
              grep -q '^Timestamp=' <<< "$info" || { echo "::error::$rel ($a): no secure timestamp"; exit 1; }
              echo "already signed here: $rel ($a), $(grep '^Identifier=' <<< "$info")"
            done
          done < <(find "$app" -type f -print0)
          [ "$n" -ge 1 ] || { echo "::error::the app holds no program"; exit 1; }
          echo "== $(basename "$app")"
          retry codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$app"
          codesign --verify --strict --deep --verbose=2 "$app"
          info=$(codesign --display --verbose=2 "$app" 2>&1)
          grep -E '^(Identifier=|Format=|CodeDirectory |Authority=|Timestamp=|TeamIdentifier=)' <<< "$info"
          grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' <<< "$info" || { echo "::error::the app: no hardened runtime"; exit 1; }
          grep -q '^Timestamp=' <<< "$info" || { echo "::error::the app: no secure timestamp"; exit 1; }
          dmg="$RUNNER_TEMP/out/$DMG_NAME"
          retry hdiutil create -volname "$vol" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
          retry codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$SIGN_IDENTITY" "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"

      - name: Notarize and staple the disk images
        id: notarize
        if: inputs.notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          retry() { local n; for n in 1 2 3; do "$@" && return 0; echo "attempt $n failed: $1"; [ "$n" = 3 ] || sleep $((n * 15)); done; return 1; }
          summary=""
          shopt -s nullglob
          dmgs=("$RUNNER_TEMP"/out/*.dmg)
          [ "${#dmgs[@]}" -ge 1 ] || { echo "::error::no disk image to notarize"; exit 1; }
          for dmg in "${dmgs[@]}"; do
            name=$(basename "$dmg")
            echo "== $name"
            rc=0
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" --wait --timeout 1h --output-format json \
              > "$RUNNER_TEMP/notary.json" 2> "$RUNNER_TEMP/notary.err" || rc=$?
            cat "$RUNNER_TEMP/notary.err" >&2 || true
            cat "$RUNNER_TEMP/notary.json" || true
            echo
            id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json" 2> /dev/null || true)
            status=$(jq -r '.status // empty' "$RUNNER_TEMP/notary.json" 2> /dev/null || true)
            if [ -n "$id" ]; then
              if xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" "$RUNNER_TEMP/notary-log-$name.json" > /dev/null; then
                jq '{status, statusSummary, statusCode, issues}' "$RUNNER_TEMP/notary-log-$name.json"
              fi
            fi
            if [ "$rc" != 0 ] || [ "$status" != Accepted ]; then
              echo "::error::notarization of $name: ${status:-no result} (notarytool exit $rc). The messages above say why."
              exit 1
            fi
            echo "$name: Accepted by the notary service (submission $id), stapling the ticket"
            retry xcrun stapler staple "$dmg"
            summary+="$name: notarized (submission $id), ticket stapled"$'\n'
          done
          { echo "notary<<NOTARY_EOF"; printf '%s' "$summary"; echo "NOTARY_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Verify (spctl, codesign --verify --strict, each disk image holds its signed binary)
        if: inputs.kind != 'installers'
        env:
          NOTARIZE: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            b="$RUNNER_TEMP/out/$t/validator"
            dmg="$RUNNER_TEMP/out/validator-$VERSION-$t.dmg"
            echo "== $(basename "$dmg")"
            if [ "$NOTARIZE" = true ]; then
              out=$(spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1) || { echo "$out"; echo "::error::spctl rejected $(basename "$dmg")"; exit 1; }
              echo "$out"
              grep -q 'source=Notarized Developer ID' <<< "$out" || { echo "::error::$(basename "$dmg") is not accepted as notarized"; exit 1; }
              xcrun stapler validate "$dmg"
            else
              echo "::warning::$(basename "$dmg") is codesigned but not notarized (notarize=false)"
            fi
            codesign --verify --strict --verbose=2 "$dmg"
            echo "== $t/validator"
            codesign --verify --strict --verbose=2 "$b"
            if [ "$NOTARIZE" = true ]; then
              # Informational, never fatal: Apple's online record of the binary,
              # notarized inside its .dmg (a bare binary cannot be stapled).
              codesign --verify --verbose=2 -R='notarized' --check-notarization "$b" 2>&1 || echo "(no online notarization record found for $t/validator)"
            fi
            m="$RUNNER_TEMP/mnt-$t"
            hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$m" "$dmg" > /dev/null
            ls -l "$m"
            cmp "$m/validator" "$b"
            codesign --verify --strict --verbose=2 "$m/validator"
            hdiutil detach "$m" > /dev/null || hdiutil detach -force "$m" > /dev/null
          done

      - name: "Installers: verify (spctl on the disk image and on the app in it, codesign --verify --strict --deep)"
        if: inputs.kind == 'installers'
        env:
          NOTARIZE: ${{ inputs.notarize }}
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/out/$DMG_NAME"
          echo "== $DMG_NAME"
          if [ "$NOTARIZE" = true ]; then
            out=$(spctl -a -vv -t open --context context:primary-signature "$dmg" 2>&1) || { echo "$out"; echo "::error::spctl rejected $DMG_NAME"; exit 1; }
            echo "$out"
            grep -q 'source=Notarized Developer ID' <<< "$out" || { echo "::error::$DMG_NAME is not accepted as notarized"; exit 1; }
            xcrun stapler validate "$dmg"
          else
            echo "::warning::$DMG_NAME is codesigned but not notarized (notarize=false)"
          fi
          codesign --verify --strict --verbose=2 "$dmg"
          m="$RUNNER_TEMP/mnt-out"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$m" "$dmg" > /dev/null
          ls -la "$m"
          app="$m/$APP_NAME"
          echo "== $APP_NAME"
          codesign --verify --strict --deep --verbose=2 "$app"
          if [ "$NOTARIZE" = true ]; then
            # Gatekeeper's verdict on the app as a person opens it; the app's
            # notarization is looked up online (the ticket is stapled to the
            # disk image, not to the app).
            ok=""
            for n in 1 2 3 4 5; do
              if out=$(spctl -a -vv -t exec "$app" 2>&1) && grep -q 'source=Notarized Developer ID' <<< "$out"; then ok=1; break; fi
              echo "attempt $n: $out"
              sleep 20
            done
            echo "$out"
            [ -n "$ok" ] || { echo "::error::Gatekeeper does not accept $APP_NAME as notarized"; exit 1; }
          fi
          hdiutil detach "$m" > /dev/null || hdiutil detach -force "$m" > /dev/null

      - name: SHA-256 of the signed files, and encrypt them to recipient_cert
        id: encrypt
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done > ../macos.sums
          cat ../macos.sums
          { echo "sums<<SUMS_EOF"; cat ../macos.sums; echo "SUMS_EOF"; } >> "$GITHUB_OUTPUT"
          tarball="../validator-$VERSION-macos-signed.tar"
          COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata -cf "$tarball" ./*
          mkdir -p ../upload
          openssl smime -encrypt -binary -aes256 -outform DER -in "$tarball" \
            -out "../upload/validator-$VERSION-macos-signed.tar.p7m" ../recipient.pem
          rm -f "$tarball"
          ls -l ../upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validator-${{ inputs.version }}-macos-signed
          path: ${{ runner.temp }}/upload/validator-${{ inputs.version }}-macos-signed.tar.p7m
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Delete the keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          security default-keychain -s login.keychain || true
          rm -f "$RUNNER_TEMP/signing_certificate.p12"

  windows:
    name: Windows (AzureSignTool)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    outputs:
      sums: ${{ steps.encrypt.outputs.sums }}
      authenticode: ${{ steps.verify.outputs.authenticode }}
    steps:
      - name: Fetch the bundle and check its SHA-256 (before anything else)
        run: |
          if ($env:VERSION -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw 'version is not like 1.2.3 or 1.2.3-rc.1' }
          if ($env:KIND -cnotmatch '^(binaries|installers|setup)$') { throw 'kind is binaries, installers or setup' }
          $want = $env:BUNDLE_SHA256.ToLowerInvariant()
          if ($want -cnotmatch '^[0-9a-f]{64}$') { throw 'bundle_sha256 is not 64 hex digits' }
          $url = (Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json).inputs.bundle_url
          Write-Output "::add-mask::$($url.Replace('%', '%25'))"
          if (-not $url.StartsWith('https://')) { throw 'bundle_url is not an https:// link' }
          $zip = Join-Path $env:RUNNER_TEMP 'bundle.zip'
          & curl.exe --proto '=https' --tlsv1.2 -fsS --retry 3 --retry-all-errors -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "the download failed (curl exit $LASTEXITCODE)" }
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "the bundle's SHA-256 is $got, expected $want" }
          Write-Output "bundle: $((Get-Item -LiteralPath $zip).Length) bytes, SHA-256 $got, as expected"

      - name: Check recipient_cert
        shell: bash
        env:
          RECIPIENT_CERT: ${{ inputs.recipient_cert }}
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$RUNNER_TEMP")"
          printf '%s\n' "$RECIPIENT_CERT" > recipient.pem
          openssl version
          openssl x509 -in recipient.pem -noout -subject -enddate
          text=$(openssl x509 -in recipient.pem -noout -text)
          grep -q rsaEncryption <<< "$text" || { echo "::error::recipient_cert does not hold an RSA key"; exit 1; }
          openssl x509 -in recipient.pem -noout -checkend 3600 > /dev/null || { echo "::error::recipient_cert expires within the hour"; exit 1; }

      - name: Take the Windows files out of the bundle
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $out = Join-Path $env:RUNNER_TEMP 'out\x86_64-pc-windows-msvc'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $env:RUNNER_TEMP 'bundle.zip'))
          try {
            foreach ($e in $zip.Entries) {
              $n = $e.FullName
              if ($env:KIND -eq 'setup') {
                # kind setup: the Setup.exe bundles only (their .msi was signed by an installers run).
                $take = $n -cmatch '^x86_64-pc-windows-msvc/[A-Za-z0-9][A-Za-z0-9._-]*\.exe$' -and $n -cne 'x86_64-pc-windows-msvc/validator.exe' -and -not $n.EndsWith('.engine.exe')
              } else {
                # kind installers: the .msi files only (their validator.exe was signed by a binaries run).
                $take = ($n -ceq 'x86_64-pc-windows-msvc/validator.exe' -and $env:KIND -ne 'installers') -or $n -cmatch '^x86_64-pc-windows-msvc/[A-Za-z0-9][A-Za-z0-9._-]*\.msi$'
              }
              if ($take) {
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, (Join-Path $out $e.Name), $false)
                Write-Output "to sign: $n"
              } elseif (-not $n.EndsWith('/')) {
                Write-Output "ignored here: $n"
              }
            }
          } finally { $zip.Dispose() }
          if ($env:KIND -eq 'setup') {
            $setups = @(Get-ChildItem -LiteralPath $out -Filter *.exe)
            if ($setups.Count -lt 1) { throw 'a setup bundle holds at least one x86_64-pc-windows-msvc/<name>.exe' }
            foreach ($s in $setups) {
              $h = New-Object byte[] 4096
              $fs = [System.IO.File]::OpenRead($s.FullName)
              try { [void]$fs.Read($h, 0, $h.Length) } finally { $fs.Dispose() }
              $pe = [BitConverter]::ToInt32($h, 0x3C)
              if (-not ($h[0] -eq 0x4D -and $h[1] -eq 0x5A -and $pe -ge 0 -and $pe -le 4090 -and [BitConverter]::ToUInt32($h, $pe) -eq 0x00004550)) {
                throw "$($s.Name) is not a Windows program"
              }
            }
          } elseif ($env:KIND -eq 'installers') {
            if (@(Get-ChildItem -LiteralPath $out -Filter *.msi).Count -lt 1) { throw 'an installers bundle holds at least one x86_64-pc-windows-msvc/<name>.msi' }
          } else {
            $exe = Join-Path $out 'validator.exe'
            if (-not (Test-Path -LiteralPath $exe)) { throw 'the bundle has no x86_64-pc-windows-msvc/validator.exe' }
            $h = New-Object byte[] 4096
            $fs = [System.IO.File]::OpenRead($exe)
            try { [void]$fs.Read($h, 0, $h.Length) } finally { $fs.Dispose() }
            $pe = [BitConverter]::ToInt32($h, 0x3C)
            $isPe = $h[0] -eq 0x4D -and $h[1] -eq 0x5A -and $pe -ge 0 -and $pe -le 4090
            if (-not $isPe -or [BitConverter]::ToUInt32($h, $pe) -ne 0x00004550 -or [BitConverter]::ToUInt16($h, $pe + 4) -ne 0x8664) {
              throw 'validator.exe is not an x86-64 Windows program'
            }
          }
          foreach ($m in Get-ChildItem -LiteralPath $out -Filter *.msi) {
            $b = New-Object byte[] 8
            $fs = [System.IO.File]::OpenRead($m.FullName)
            try { [void]$fs.Read($b, 0, 8) } finally { $fs.Dispose() }
            $magic = ($b | ForEach-Object { $_.ToString('x2') }) -join ''
            if ($magic -ne 'd0cf11e0a1b11ae1') { throw "$($m.Name) is not an MSI package" }
          }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install AzureSignTool 6.0.1 (as sign-windows.yml)
        run: |
          dotnet tool install --global AzureSignTool --version 6.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: "Setup: WiX Toolset 5.0.2 (pinned), for wix burn detach and reattach"
        if: inputs.kind == 'setup'
        run: dotnet tool install --global wix --version 5.0.2

      - name: "Setup: sign each Burn engine, put it back, then sign the whole file"
        if: inputs.kind == 'setup'
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CERT_NAME: ${{ secrets.CERT_NAME }}
        run: |
          # Burn runs the installation from an elevated copy of its engine, so
          # the engine carries its own signature (the publisher UAC shows); the
          # whole file is signed after the signed engine is put back.
          $common = @(
            'sign',
            '--azure-key-vault-url', $env:AZURE_KEY_VAULT_URL,
            '--azure-key-vault-client-id', $env:AZURE_CLIENT_ID,
            '--azure-key-vault-client-secret', $env:AZURE_CLIENT_SECRET,
            '--azure-key-vault-tenant-id', $env:AZURE_TENANT_ID,
            '--azure-key-vault-certificate', $env:CERT_NAME,
            '--file-digest', 'sha256',
            '--timestamp-rfc3161', 'http://timestamp.digicert.com',
            '--timestamp-digest', 'sha256'
          )
          $dir = Join-Path $env:RUNNER_TEMP 'out\x86_64-pc-windows-msvc'
          $work = Join-Path $env:RUNNER_TEMP 'burn'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          # The bundle's Setup.exe files, listed once, before any engine is written beside them.
          $setups = @(Get-ChildItem -LiteralPath $dir -Filter *.exe | Where-Object { -not $_.Name.EndsWith('.engine.exe') } | Sort-Object Name)
          foreach ($f in $setups) {
            $engine = Join-Path $dir ([IO.Path]::GetFileNameWithoutExtension($f.Name) + '.engine.exe')
            $joined = Join-Path $work $f.Name
            Write-Output "== $($f.Name): its engine"
            & wix burn detach $f.FullName -engine $engine
            if ($LASTEXITCODE -ne 0) { throw "$($f.Name) is not a WiX Burn bundle (wix burn detach: exit $LASTEXITCODE); a setup bundle holds Setup.exe files only" }
            & azuresigntool @common $engine
            if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed on the engine of $($f.Name) (exit $LASTEXITCODE)" }
            Write-Output "== $($f.Name): the signed engine put back"
            & wix burn reattach $f.FullName -engine $engine -o $joined
            if ($LASTEXITCODE -ne 0) { throw "wix burn reattach failed on $($f.Name) (exit $LASTEXITCODE)" }
            Move-Item -Force -LiteralPath $joined -Destination $f.FullName
            Write-Output "== $($f.Name)"
            & azuresigntool @common $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed on $($f.Name) (exit $LASTEXITCODE)" }
          }

      - name: Sign each .exe and .msi (Azure Key Vault certificate, sha256, RFC 3161 timestamp)
        if: inputs.kind != 'setup'
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CERT_NAME: ${{ secrets.CERT_NAME }}
        run: |
          # The flags of scripts/windows-sign-hook.cjs, passed as a list.
          $common = @(
            'sign',
            '--azure-key-vault-url', $env:AZURE_KEY_VAULT_URL,
            '--azure-key-vault-client-id', $env:AZURE_CLIENT_ID,
            '--azure-key-vault-client-secret', $env:AZURE_CLIENT_SECRET,
            '--azure-key-vault-tenant-id', $env:AZURE_TENANT_ID,
            '--azure-key-vault-certificate', $env:CERT_NAME,
            '--file-digest', 'sha256',
            '--timestamp-rfc3161', 'http://timestamp.digicert.com',
            '--timestamp-digest', 'sha256'
          )
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'out') -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' } | Sort-Object FullName)
          foreach ($f in $files) {
            Write-Output "== $($f.Name)"
            & azuresigntool @common $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "AzureSignTool failed on $($f.Name) (exit $LASTEXITCODE)" }
          }

      - name: Verify (Get-AuthenticodeSignature)
        id: verify
        run: |
          $files = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'out') -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' } | Sort-Object FullName)
          $lines = @()
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            Write-Output ('{0}: {1} ({2})' -f $f.Name, $s.Status, $s.StatusMessage)
            Write-Output ('  signer:     {0}' -f $s.SignerCertificate.Subject)
            Write-Output ('  issuer:     {0}' -f $s.SignerCertificate.Issuer)
            Write-Output ('  thumbprint: {0}' -f $s.SignerCertificate.Thumbprint)
            Write-Output ('  timestamp:  {0}' -f $s.TimeStamperCertificate.Subject)
            if ($s.Status -ne 'Valid') { throw "$($f.Name): the signature is $($s.Status)" }
            if ($null -eq $s.TimeStamperCertificate) { throw "$($f.Name): the signature has no timestamp" }
            $lines += "$($f.Name): Authenticode Valid, timestamped, signer $($s.SignerCertificate.Subject)"
          }
          if ($env:KIND -eq 'setup') {
            # Each Setup.exe and its engine are signed with the same certificate:
            # Burn's elevated copy of the engine (what UAC names) carries the
            # engine's signature. The validator's release checks that the file is
            # the build with this engine reattached plus a signature, and the
            # elevated copy itself when it installs the signed Setup.exe.
            $dir = Join-Path $env:RUNNER_TEMP 'out\x86_64-pc-windows-msvc'
            foreach ($f in @(Get-ChildItem -LiteralPath $dir -Filter *.exe | Where-Object { -not $_.Name.EndsWith('.engine.exe') } | Sort-Object Name)) {
              $engine = Join-Path $dir ([IO.Path]::GetFileNameWithoutExtension($f.Name) + '.engine.exe')
              if (-not (Test-Path -LiteralPath $engine)) { throw "$($f.Name): no signed engine beside it" }
              $outer = (Get-AuthenticodeSignature -LiteralPath $f.FullName).SignerCertificate.Thumbprint
              $inner = (Get-AuthenticodeSignature -LiteralPath $engine).SignerCertificate.Thumbprint
              if ($outer -ne $inner) { throw "$($f.Name): the file and its engine are signed with different certificates" }
              $lines += "$($f.Name): the file and its engine signed with the same certificate"
            }
          }
          "authenticode<<AUTH_EOF`n$($lines -join "`n")`nAUTH_EOF" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: SHA-256 of the signed files, and encrypt them to recipient_cert
        id: encrypt
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$RUNNER_TEMP")/out"
          find . -type f | sed 's|^\./||' | LC_ALL=C sort | while IFS= read -r f; do
            printf '%s  %s\n' "$(sha256sum -b "$f" | cut -d' ' -f1)" "$f"
          done > ../windows.sums
          cat ../windows.sums
          { echo "sums<<SUMS_EOF"; cat ../windows.sums; echo "SUMS_EOF"; } >> "$GITHUB_OUTPUT"
          tarball="../validator-$VERSION-windows-signed.tar"
          tar -cf "$tarball" ./*
          mkdir -p ../upload
          openssl smime -encrypt -binary -aes256 -outform DER -in "$tarball" \
            -out "../upload/validator-$VERSION-windows-signed.tar.p7m" ../recipient.pem
          rm -f "$tarball"
          ls -l ../upload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validator-${{ inputs.version }}-windows-signed
          path: ${{ runner.temp }}/upload/validator-${{ inputs.version }}-windows-signed.tar.p7m
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  sums:
    name: SHA256SUMS
    needs: [macos, windows]
    # kind setup has no macOS job.
    if: >-
      always() && needs.windows.result == 'success'
      && (needs.macos.result == 'success' || (inputs.kind == 'setup' && needs.macos.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SHA256SUMS of every signed file
        env:
          MACOS_SUMS: ${{ needs.macos.outputs.sums }}
          WINDOWS_SUMS: ${{ needs.windows.outputs.sums }}
          NOTARY: ${{ needs.macos.outputs.notary }}
          AUTHENTICODE: ${{ needs.windows.outputs.authenticode }}
          # Also set for the whole workflow; named here because the checks below depend on them.
          VERSION: ${{ inputs.version }}
          KIND: ${{ inputs.kind || 'binaries' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sums"
          s="$RUNNER_TEMP/sums/SHA256SUMS"
          printf '%s\n%s\n' "$MACOS_SUMS" "$WINDOWS_SUMS" | sed '/^$/d' | LC_ALL=C sort -k2 > "$s"
          if grep -vE '^[0-9a-f]{64}  [A-Za-z0-9][A-Za-z0-9._/-]*$' "$s"; then
            echo "::error::a malformed line in SHA256SUMS (above)"
            exit 1
          fi
          if [ "$KIND" = setup ]; then
            setups=$(cut -c67- "$s" | grep -E '^x86_64-pc-windows-msvc/[^/]+\.exe$' | grep -v '\.engine\.exe$' || true)
            [ -n "$setups" ] || { echo "::error::SHA256SUMS lists no Setup.exe"; exit 1; }
            while IFS= read -r f; do
              cut -c67- "$s" | grep -qxF "${f%.exe}.engine.exe" || { echo "::error::SHA256SUMS lists no engine for $f"; exit 1; }
            done <<< "$setups"
          elif [ "$KIND" = installers ]; then
            cut -c67- "$s" | grep -qE '^[^/]+\.dmg$' || { echo "::error::SHA256SUMS lists no disk image"; exit 1; }
            cut -c67- "$s" | grep -qE '^x86_64-pc-windows-msvc/[^/]+\.msi$' || { echo "::error::SHA256SUMS lists no .msi"; exit 1; }
          else
            for f in aarch64-apple-darwin/validator x86_64-apple-darwin/validator \
              "validator-$VERSION-aarch64-apple-darwin.dmg" "validator-$VERSION-x86_64-apple-darwin.dmg" \
              x86_64-pc-windows-msvc/validator.exe; do
              cut -c67- "$s" | grep -qxF "$f" || { echo "::error::SHA256SUMS does not list $f"; exit 1; }
            done
          fi
          cat "$s"
          {
            echo "### validator $VERSION, signed ($KIND)"
            echo
            echo '```'
            cat "$s"
            echo '```'
            echo
            printf '%s\n%s\n' "$NOTARY" "$AUTHENTICODE" | sed '/^$/d; s/^/- /'
            echo
            echo "The signed files are this run's artifacts, encrypted to recipient_cert."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validator-${{ inputs.version }}-SHA256SUMS
          path: ${{ runner.temp }}/sums/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
